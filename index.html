<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Characters</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main">
    <div class="main-list">
      <h1>Characters</h1>

      <div class="search-wrap">
        <label>Search</label>
        <input type="text" id="searchInput" placeholder="Search...">
      </div>

      <div class="filter-group">
        <label>Path</label>
        <div class="filter-pills" id="pathFilters"></div>
      </div>

      <div class="filter-group">
        <label>Element</label>
        <div class="filter-pills" id="elementFilters"></div>
      </div>

      <div class="filter-group">
        <label>Rating</label>
        <div class="filter-pills" id="ratingFilters"></div>
      </div>

      <div class="grid" id="charGrid"></div>
    </div>
    <div class="char-page" id="charPage"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
